<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анкета</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #6d6d72);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 30%, transparent);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px 48px;
    background: var(--bg); color: var(--text);
    font: 17px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 28px; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 8px; }
  .lead { color: var(--hint); margin: 0 0 40px; }
  fieldset { border: 0; padding: 0; margin: 0 0 36px; min-width: 0; }
  legend, label.title { display: block; font-weight: 600; padding: 0; margin-bottom: 6px; }

  input[type="text"] {
    width: 100%; padding: 10px 0; font: inherit; font-size: 18px; color: var(--text);
    background: transparent; border: 0; border-bottom: 2px solid var(--line); border-radius: 0;
    transition: border-color .15s;
  }
  input[type="text"]:focus { outline: none; border-bottom-color: var(--accent); }

  .option {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 0; cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .option:last-of-type { border-bottom: 0; }
  .option input { position: absolute; opacity: 0; pointer-events: none; }
  .mark {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--hint); display: grid; place-items: center;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .mark::after {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent-text); transform: scale(0); transition: transform .15s;
  }
  input:checked + .mark { background: var(--accent); border-color: var(--accent); }
  input:checked + .mark::after { transform: scale(1); }
  input:checked + .mark { animation: pop .3s ease-out; }
  .option:active .mark { transform: scale(.9); }
  input:focus-visible + .mark { outline: 2px solid var(--accent); outline-offset: 3px; }

  .progress { color: var(--hint); font-size: 15px; margin: 0 0 12px; }
  .error { color: #d93025; margin: 0 0 12px; min-height: 1.45em; }
  .error.show { animation: nudge .25s ease-out; }
  button {
    width: 100%; padding: 16px; font: inherit; font-weight: 600;
    color: var(--accent-text); background: var(--accent);
    border: 0; border-radius: 14px; cursor: pointer;
    transition: transform .1s;
  }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  pre { white-space: pre-wrap; padding: 12px 0; border-top: 1px solid var(--line); }
  main { animation: rise .45s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes nudge { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <form id="form" novalidate></form>
</main>

<script>
  // ↓↓↓ ЗДЕСЬ МЕНЯЕТЕ ЗАГОЛОВОК, ВОПРОСЫ И ВАРИАНТЫ ОТВЕТОВ ↓↓↓
  const TITLE = "Анкета";
  const LEAD = "Несколько вопросов, это займёт минуту.";
  const QUESTIONS = [
    { id: "source", text: "Как вы о нас узнали?",
      options: ["От друзей", "В соцсетях", "В поиске", "Другое"] },
    { id: "frequency", text: "Как часто вы нами пользуетесь?",
      options: ["Каждый день", "Раз в неделю", "Раз в месяц", "Впервые"] },
    { id: "rating", text: "Как вы оцениваете наш сервис?",
      options: ["Отлично", "Хорошо", "Нормально", "Плохо"] }
  ];
  // ↑↑↑ ДАЛЬШЕ КОД МЕНЯТЬ НЕ НУЖНО ↑↑↑

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  document.getElementById("title").textContent = TITLE;
  document.getElementById("lead").textContent = LEAD;
  const form = document.getElementById("form");

  form.insertAdjacentHTML("beforeend", `
    <fieldset>
      <label class="title" for="name">Как вас зовут?</label>
      <input type="text" id="name" name="name" autocomplete="name" maxlength="100">
    </fieldset>`);

  QUESTIONS.forEach(q => {
    const opts = q.options.map(o => `
      <label class="option">
        <input type="radio" name="${q.id}" value="${o}">
        <span class="mark"></span><span>${o}</span>
      </label>`).join("");
    form.insertAdjacentHTML("beforeend",
      `<fieldset><legend>${q.text}</legend>${opts}</fieldset>`);
  });

  form.insertAdjacentHTML("beforeend", `
    <p class="progress" id="progress"></p>
    <p class="error" id="error" role="alert"></p>
    <button type="submit">Отправить анкету</button>`);

  const progress = document.getElementById("progress");
  function updateProgress() {
    const done = QUESTIONS.filter(q => form.querySelector(`input[name="${q.id}"]:checked`)).length;
    progress.textContent = `Отвечено ${done} из ${QUESTIONS.length}`;
  }
  form.addEventListener("change", updateProgress);
  updateProgress();

  form.addEventListener("submit", e => {
    e.preventDefault();
    const error = document.getElementById("error");
    const smooth = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
    const showError = (msg, target) => {
      error.textContent = msg;
      error.classList.remove("show"); void error.offsetWidth; error.classList.add("show");
      if (target) target.scrollIntoView({ behavior: smooth, block: "center" });
    };
    const name = document.getElementById("name").value.trim();
    if (!name) { showError("Введите имя.", document.getElementById("name")); return; }

    const answers = {};
    for (const q of QUESTIONS) {
      const checked = form.querySelector(`input[name="${q.id}"]:checked`);
      if (!checked) {
        showError(`Выберите ответ: «${q.text}»`, form.querySelector(`input[name="${q.id}"]`).closest("fieldset"));
        return;
      }
      answers[q.id] = checked.value;
    }
    error.textContent = "";

    const result = { name, answers };
    if (tg.initData) {
      tg.sendData(JSON.stringify(result));   // внутри Telegram: отправка боту
    } else {
      // при открытии в обычном браузере: просто показываем результат
      form.innerHTML = "<p>Тестовый режим (вне Telegram). Результат:</p><pre></pre>";
      form.querySelector("pre").textContent = JSON.stringify(result, null, 2);
    }
  });
</script>
</body>
</html>
