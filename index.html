<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анкета</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #6d6d72);
    --field: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 40px;
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 24px; }
  fieldset { border: 0; padding: 0; margin: 0 0 24px; }
  legend, label.title { display: block; font-weight: 600; margin-bottom: 10px; padding: 0; }
  input[type="text"] {
    width: 100%; padding: 14px; font: inherit; color: var(--text);
    background: var(--field); border: 2px solid transparent; border-radius: 12px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .option {
    display: flex; align-items: center; gap: 12px;
    padding: 14px; margin-bottom: 8px; cursor: pointer;
    background: var(--field); border: 2px solid transparent; border-radius: 12px;
  }
  .option:has(input:checked) { border-color: var(--accent); }
  .option:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .option input { accent-color: var(--accent); width: 20px; height: 20px; margin: 0; }
  button {
    width: 100%; padding: 16px; font: inherit; font-weight: 600;
    color: var(--accent-text); background: var(--accent);
    border: 0; border-radius: 12px; cursor: pointer;
  }
  .error { color: #d93025; margin: 0 0 12px; min-height: 1.4em; }
  pre { background: var(--field); padding: 12px; border-radius: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Анкета</h1>
  <form id="form" novalidate></form>
</main>

<script>
  // ↓↓↓ ЗДЕСЬ МЕНЯЕТЕ ВОПРОСЫ И ВАРИАНТЫ ОТВЕТОВ ↓↓↓
  const QUESTIONS = [
    { id: "source", text: "Как вы о нас узнали?",
      options: ["От друзей", "В соцсетях", "В поиске", "Другое"] },
    { id: "frequency", text: "Как часто вы нами пользуетесь?",
      options: ["Каждый день", "Раз в неделю", "Раз в месяц", "Впервые"] },
    { id: "rating", text: "Как вы оцениваете наш сервис?",
      options: ["Отлично", "Хорошо", "Нормально", "Плохо"] }
  ];
  // ↑↑↑ ДАЛЬШЕ КОД МЕНЯТЬ НЕ НУЖНО ↑↑↑

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const form = document.getElementById("form");

  // Поле имени
  form.insertAdjacentHTML("beforeend", `
    <fieldset>
      <label class="title" for="name">Как вас зовут?</label>
      <input type="text" id="name" name="name" autocomplete="name" maxlength="100">
    </fieldset>`);

  // Вопросы с выбором одного варианта
  QUESTIONS.forEach(q => {
    const opts = q.options.map(o => `
      <label class="option">
        <input type="radio" name="${q.id}" value="${o}"><span>${o}</span>
      </label>`).join("");
    form.insertAdjacentHTML("beforeend",
      `<fieldset><legend>${q.text}</legend>${opts}</fieldset>`);
  });

  form.insertAdjacentHTML("beforeend",
    `<p class="error" id="error" role="alert"></p><button type="submit">Отправить анкету</button>`);

  form.addEventListener("submit", e => {
    e.preventDefault();
    const error = document.getElementById("error");
    const name = document.getElementById("name").value.trim();
    if (!name) { error.textContent = "Введите имя."; return; }

    const answers = {};
    for (const q of QUESTIONS) {
      const checked = form.querySelector(`input[name="${q.id}"]:checked`);
      if (!checked) { error.textContent = `Выберите ответ: «${q.text}»`; return; }
      answers[q.id] = checked.value;
    }
    error.textContent = "";

    const result = { name, answers };
    if (tg.initData) {
      tg.sendData(JSON.stringify(result));   // внутри Telegram: отправка боту
    } else {
      // при открытии в обычном браузере: просто показываем результат
      form.innerHTML = "<p>Тестовый режим (вне Telegram). Результат:</p><pre></pre>";
      form.querySelector("pre").textContent = JSON.stringify(result, null, 2);
    }
  });
</script>
</body>
</html>
